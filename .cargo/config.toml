[env]
# libopus (audiopus_sys, through windowcast's host in droidtop-agent's service)
# is built with CMake from a CMakeLists that asks for an old minimum version,
# which CMake 4 refuses unless told this policy floor. droidtop-agent's and
# windowcast's own .cargo/config.toml say the same.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
