on: [push, pull_request]

# Builds Pythia every way it ships (the Python wheel and sdist, a meson
# install, the Debian package) and runs what each one installed, on Linux
# and, for the wheel, on Windows. Each build includes pythia._native (native/),
# built with cargo: the runners' Rust for the wheels, Ubuntu's rustc-1.85 for
# the Debian package, as Launchpad builds it. Static Analysis (static.yml) checks the
# code; this checks that it builds and starts.
name: Build

jobs:
  deb:
    name: Meson and Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson gettext desktop-file-utils appstream-util \
            debhelper dh-python dh-apparmor appstream dpkg-dev python3-all cargo-1.85 rustc-1.85
      - name: Meson build, its tests (desktop files, metainfo) and install
        run: |
          meson setup builddir
          meson test -C builddir --print-errorlogs
          DESTDIR="$RUNNER_TEMP/meson-install" meson install -C builddir
      - name: Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../pythia_*.deb dist/
      - name: Install the package and run it
        run: |
          sudo apt-get install -y ./dist/pythia_*.deb
          /usr/games/pythia --version
          cd "$RUNNER_TEMP" && /usr/bin/python3 -c "import pythia._native as n; print('pythia._native', n.__version__)"
          HOME="$RUNNER_TEMP/home" /usr/games/pythia --list-games
      - uses: actions/upload-artifact@v4
        with:
          name: pythia-deb
          path: dist/*.deb

  wheel:
    name: Wheel and sdist (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries the Linux dependencies build against
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libdbus-1-dev pkg-config libcairo2-dev
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/pythia" --version
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/venv/bin/python" -c "import pythia._native as n; print('pythia._native', n.__version__)"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/venv/bin/pythia" --list-games
      - uses: actions/upload-artifact@v4
        with:
          name: pythia-python
          path: dist/*

  windows:
    name: Wheel (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, install and run
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv "$env:RUNNER_TEMP\venv"
          & "$env:RUNNER_TEMP\venv\Scripts\pip.exe" install (Get-ChildItem dist\*.whl).FullName
          & "$env:RUNNER_TEMP\venv\Scripts\pythia.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -c "import pythia._native as n; print('pythia._native', n.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\localappdata"
          & "$env:RUNNER_TEMP\venv\Scripts\pythia.exe" --list-games
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
