name: Format (temporary)

# Runs ruff format on this branch and commits what it changes. Removed again before the branch lands.
on:
  push:
    branches: [ci/backend-gaming2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.12.1
      - run: ruff format pythia tests
      - name: Commit what it changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A pythia tests
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Ruff's format on the batch 2 files" -m "Changelog: none"
          git push origin HEAD:${GITHUB_REF_NAME}
