[package]
name = "pythia-native"
version = "0.1.0"
edition = "2021"
# Linked with droidtop-agent's crates, which are GPL-3.0-only.
license = "GPL-3.0-only"
publish = false
rust-version = "1.85"
description = "Pythia's droidtop side: the computer's agent for droidtop handhelds, as Pythia's own extension module"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# droidtop-agent's crates, used as they are: the protocol and channel the
# handhelds speak (core) and the computer's side (store, pair, scan, saves,
# service). Pinned by commit; moving the pin is a change of its own.
droidtop-agent-core = { git = "https://github.com/Droidtop/droidtop-agent", rev = "8921635019f21eea9df6d1827576c80eda2b2e1e" }
droidtop-agent-store = { git = "https://github.com/Droidtop/droidtop-agent", rev = "8921635019f21eea9df6d1827576c80eda2b2e1e" }
droidtop-agent-pair = { git = "https://github.com/Droidtop/droidtop-agent", rev = "8921635019f21eea9df6d1827576c80eda2b2e1e" }
droidtop-agent-scan = { git = "https://github.com/Droidtop/droidtop-agent", rev = "8921635019f21eea9df6d1827576c80eda2b2e1e" }
droidtop-agent-saves = { git = "https://github.com/Droidtop/droidtop-agent", rev = "8921635019f21eea9df6d1827576c80eda2b2e1e" }
droidtop-agent-service = { git = "https://github.com/Droidtop/droidtop-agent", rev = "8921635019f21eea9df6d1827576c80eda2b2e1e" }
# windowcast's host identity folder, the one droidtop-agent and windowcast share,
# at the commit droidtop-agent pins.
windowcast-identity = { git = "https://github.com/Droidtop/windowcast", rev = "93efcb9ebf108ae71222b9fe3e19d0d57cfb102e" }
serde_json = "1"
# The stable ABI (abi3) from Python 3.10 on: one build per system serves
# every newer Python. generate-import-lib lets Windows link without an
# installed Python's import library.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
