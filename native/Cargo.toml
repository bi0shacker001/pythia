[package]
name = "pythia-native"
version = "0.1.0"
edition = "2021"
# Linked with droidtop-agent's crates, which are GPL-3.0-only.
license = "GPL-3.0-only"
publish = false
rust-version = "1.85"
description = "Pythia's droidtop side: the computer's agent for droidtop handhelds, as Pythia's own extension module"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# droidtop-agent's crates, used as they are: the protocol and channel the
# handhelds speak (core) and the computer's side (store, pair, scan, saves,
# service). Pinned by commit; moving the pin is a change of its own.
droidtop-agent-core = { git = "https://github.com/Droidtop/droidtop-agent", rev = "d05105c24ce07fff6d7a7def8fdd316316e9d2d1" }
droidtop-agent-store = { git = "https://github.com/Droidtop/droidtop-agent", rev = "d05105c24ce07fff6d7a7def8fdd316316e9d2d1" }
droidtop-agent-pair = { git = "https://github.com/Droidtop/droidtop-agent", rev = "d05105c24ce07fff6d7a7def8fdd316316e9d2d1" }
droidtop-agent-scan = { git = "https://github.com/Droidtop/droidtop-agent", rev = "d05105c24ce07fff6d7a7def8fdd316316e9d2d1" }
droidtop-agent-saves = { git = "https://github.com/Droidtop/droidtop-agent", rev = "d05105c24ce07fff6d7a7def8fdd316316e9d2d1" }
droidtop-agent-service = { git = "https://github.com/Droidtop/droidtop-agent", rev = "d05105c24ce07fff6d7a7def8fdd316316e9d2d1" }
# windowcast's host identity folder, the one droidtop-agent and windowcast share,
# at the commit droidtop-agent pins.
windowcast-identity = { git = "https://github.com/Droidtop/windowcast", rev = "cd1ed2371b1e793babf6703b5dcfab94d979f1c6" }
# Where droidtop-agent keeps its files (as its Dirs::locate).
dirs = "5"
# Finding and stopping a running droidtop-agent, on every system.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Game controllers for the handheld shell (pythia._native.pad): XInput and
# Windows.Gaming.Input on Windows, evdev on Linux (links libudev).
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The stable ABI (abi3) from Python 3.10 on: one build per system serves
# every newer Python. generate-import-lib lets Windows link without an
# installed Python's import library.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[features]
# Starting Pythia's games for a handheld: needs droidtop-agent's
# launch::Launcher, which the pinned commit does not have yet.
host-launch = []

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# droidtop-agent's start at sign-in on Windows: the per-user Run key.
winreg = "0.52"
