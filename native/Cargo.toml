[package]
name = "pythia-native"
version = "0.1.0"
edition = "2021"
# Linked with droidtop-agent's crates, which are GPL-3.0-only.
license = "GPL-3.0-only"
publish = false
rust-version = "1.85"
description = "Pythia's droidtop side: the computer's agent for droidtop handhelds, as Pythia's own extension module"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# droidtop-agent's Python bindings, as a library this module is built over (droidtop-agent
# crates/python: Embedder, configure, register; Droidtop/tracker#867), and what Pythia's own submodules use
# directly: the shared libraries at the tags droidtop-agent pins, and droidtop-agent's service. Every pin
# here must be droidtop-agent's at the same commit, so one copy of each crate is linked.
droidtop-agent-python = { git = "https://github.com/Droidtop/droidtop-agent", rev = "217d1f05f57255b480a67536b3a0f4e21117fa4c" }
droidtop-agent-service = { git = "https://github.com/Droidtop/droidtop-agent", rev = "217d1f05f57255b480a67536b3a0f4e21117fa4c" }
droidtop-agent-core = { package = "sync-core", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.1" }
droidtop-agent-store = { package = "sync-store", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.1" }
# windowcast's host identity folder, the one droidtop-agent and windowcast share,
# at the commit droidtop-agent pins.
windowcast-identity = { git = "https://github.com/Droidtop/windowcast", rev = "cd1ed2371b1e793babf6703b5dcfab94d979f1c6" }
# KDE Connect, both ways (Droidtop/tracker#645): lib-kdeconnect's device and its one
# operation table, the same one droidtop's native library passes through. Pinned to the
# commit on lib-kdeconnect's ci/kdeconnect-core-645 until it is tagged v0.1.0.
kdeconnect-service = { git = "https://github.com/Droidtop/lib-kdeconnect", rev = "284fc626aaefc38c50c082b8a5610f960792f3af" }
# Where droidtop-agent keeps its files (as its Dirs::locate).
dirs = "5"
# Finding and stopping a running droidtop-agent, on every system.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Game controllers for the handheld shell (pythia._native.pad): XInput and
# Windows.Gaming.Input on Windows, evdev on Linux (links libudev).
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The stable ABI (abi3) from Python 3.10 on: one build per system serves
# every newer Python. generate-import-lib lets Windows link without an
# installed Python's import library.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# droidtop-agent's start at sign-in on Windows: the per-user Run key.
winreg = "0.52"
