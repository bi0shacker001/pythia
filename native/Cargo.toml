[package]
name = "pythia-native"
version = "0.1.0"
edition = "2021"
# Linked with droidtop-agent's crates, which are GPL-3.0-only.
license = "GPL-3.0-only"
publish = false
rust-version = "1.91"
description = "Pythia's droidtop side: the computer's agent for droidtop handhelds, as Pythia's own extension module"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# droidtop-agent's Python bindings, as a library this module is built over (droidtop-agent
# crates/python: Embedder, configure, register; mytop-project/tracker#867), and what Pythia's own submodules use
# directly: the shared libraries at the tags droidtop-agent pins, and droidtop-agent's service. Every pin
# here must be droidtop-agent's at the same commit, so one copy of each crate is linked.
droidtop-agent-python = { git = "https://github.com/mytop-project/droidtop-agent", rev = "87355dfb83aac2c620c1764b428bdae5f2421baa" }
droidtop-agent-service = { git = "https://github.com/mytop-project/droidtop-agent", rev = "87355dfb83aac2c620c1764b428bdae5f2421baa" }
droidtop-agent-core = { package = "sync-core", git = "https://github.com/mytop-project/mytop-sync", tag = "v0.2.2" }
droidtop-agent-store = { package = "sync-store", git = "https://github.com/mytop-project/mytop-sync", tag = "v0.2.2" }
# windowcast's host identity folder, the one droidtop-agent and windowcast share,
# at the commit droidtop-agent pins.
windowcast-identity = { git = "https://github.com/mytop-project/windowcast", rev = "37e2e432d565e94a83e49ea064283fbc661c2ef0" }
# KDE Connect, both ways (mytop-project/tracker#645): mytop-kdeconnect's device and its one
# operation table, the same one droidtop's native library passes through, at its v0.1.0 release.
kdeconnect-service = { git = "https://github.com/mytop-project/mytop-kdeconnect", tag = "v0.1.0" }
# The computer's own Tailscale node, read through tailscaled's LocalAPI (mytop-project/tracker#645):
# its online peers become addresses KDE Connect reaches.
net-tailscale = { git = "https://github.com/mytop-project/mytop-net", tag = "v0.2.6" }
# Where droidtop-agent keeps its files (as its Dirs::locate).
dirs = "5"
# Finding and stopping a running droidtop-agent, on every system.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Game controllers for the handheld shell (pythia._native.pad): XInput and
# Windows.Gaming.Input on Windows, evdev on Linux (links libudev).
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The stable ABI (abi3) from Python 3.10 on: one build per system serves
# every newer Python. generate-import-lib lets Windows link without an
# installed Python's import library.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
# droidtop-agent's start at sign-in on Windows: the per-user Run key.
winreg = "0.52"
