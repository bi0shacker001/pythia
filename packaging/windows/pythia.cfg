; Pythia local configuration -- lives next to pythia.exe in this portable
; bundle (see pythia/util/local_config.py). Edit and save, then restart
; Pythia for changes to take effect.
;
; ui: desktop, web, or bigpicture (blank = default UI selection logic)
; debug: true/false -- verbose logging, same as --debug/PYTHIA_DEBUG
; channel: latest, nightly, unstable, or stable -- which release channel
;          `check for updates` compares against
[pythia]
debug = false
ui =
channel = stable
