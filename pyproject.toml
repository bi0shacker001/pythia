[project]
name = "pythia"
version = "0.5.23"
authors = [
    {name = "Mathieu Comandon", email = "strider@strycore.com"}
]
description = """
Pythia is a video game preservation platform that helps you install and play video games from all eras and from most gaming systems.
By leveraging and combining existing emulators, engine re-implementations and compatibility layers, it gives you a central interface to launch all your games.
"""
readme = "README.md"
requires-python = ">=3.10"

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML",
    "lxml",
    "requests",
    "Pillow",
    "setproctitle",
    "python-magic",
    "distro",
    "dbus-python",
    "types-requests",
    "types-PyYAML",
    "evdev",
    "PyGObject",
    "pypresence",
    "protobuf",
    "moddb"
]

[project.urls]
Homepage = "https://pythia.net/"
Repository = "https://github.com/pythia/pythia"
Issues = "https://github.com/pythia/pythia/issues"

[dependency-groups]
dev = [
    "ruff==0.12.1",
    "mypy==1.16.1",
    "mypy-baseline",
    "nose2",
    "pygobject-stubs>=2.17.0"
]


[tool.mypy]
python_version = "3.10"
packages = [
    "pythia",
    "tests",
]
exclude = [
    ".*_pb2.py",  # Any automatically generated protobuf files
    "venv",
    "^build/",  # setuptools build output
]
disable_error_code = [
    "no-redef",  # Allow variable redefinition
    "has-type",  # Ignore when variable types cannot be determined.
    "dict-item",  # Dictionaries are always fully dynamic
    "var-annotated",  # Never require type annotations
    "assignment",  # Allow incompatible types in assignment (used heavily in pythia class structure).
]
allow_redefinition = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.mypy-baseline]
# --baseline-path: the file where the baseline should be stored
baseline_path = ".mypy_baseline"
# --depth: cut path names longer than that many directories deep
depth = 40
# --allow-unsynced: do not fail for unsynced resolved errors
allow_unsynced = true
# --preserve-position: do not remove error position from the baseline
preserve_position = false
# --hide-stats: do not show stats and messages at the end
hide_stats = false
# --no-colors: do not use colors in stats
no_colors = false
# --ignore: regexes for error messages to ignore
ignore = []

[[tool.mypy.overrides]]
module = [
    "pythia.api",
    "pythia.cache",
    "pythia.config",
    "pythia.database.*",
    "pythia.exception_backstops",
    "pythia.exceptions",
    "pythia.gui.dialogs",
    "pythia.monitored_command",
    "pythia.runners",
    "pythia.scanners.default_installers",
    "pythia.services.mame",
    "pythia.settings",
    "pythia.sysoptions",
    "pythia.util",
    "pythia.util.busy",
    "pythia.util.datapath",
    "pythia.util.discord.base",
    "pythia.util.graphics.*",
    "pythia.util.http",
    "pythia.util.jobs",
    "pythia.util.log",
    "pythia.util.flatpak",
    "pythia.util.retroarch.core_config",
    "pythia.util.settings",
    "pythia.util.standalone_scripts",
    "pythia.util.steam.*",
    "pythia.util.shell",
    "pythia.util.system",
    "pythia.util.timer",
    "pythia.util.ubisoft.consts",
    "pythia.util.urlhandler",
    "pythia.util.wine.d3d_extras",
    "pythia.util.wine.dgvoodoo2",
    "pythia.util.xdgshortcuts",
    "pythia.util.yaml",
    "setup",
    "utils.bios_format",
    "utils.meson_post_install",
]
# Equivalent to strict = true for per-module config
# Use strict = true when https://github.com/python/mypy/issues/11401 is fixed
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]

typeCheckingMode = "basic"
reportMissingImports = false
