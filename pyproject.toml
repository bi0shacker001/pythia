[build-system]
# setuptools-rust builds pythia._native (native/), Pythia's droidtop side, with
# cargo; building Pythia needs a Rust toolchain (1.85 or newer).
requires = ["setuptools>=77", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "pythia"
version = "0.5.23"
authors = [
    {name = "bi0shacker001"},
    {name = "Mathieu Comandon and the Lutris contributors", email = "strider@strycore.com"},
]
description = """
Pythia is a multi-system game library manager, largely based on Lutris: it tracks which versions of which games
exist on which of your computers and handhelds, where you own them, and what each one needs to run.
"""
readme = "README.rst"
requires-python = ">=3.10"

license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML",
    "lxml",
    "requests",
    "Pillow",
    "setproctitle",
    "python-magic; sys_platform == 'linux'",
    "distro",
    "dbus-python; sys_platform == 'linux'",
    "types-requests",
    "types-PyYAML",
    "evdev; sys_platform == 'linux'",
    "PyGObject; sys_platform == 'linux'",
    "pypresence",
    "protobuf",
    "moddb",
    "PySide6",
]

[project.scripts]
pythia = "pythia.launch:main"

[project.urls]
Homepage = "https://github.com/bi0shacker001/pythia"
Repository = "https://github.com/bi0shacker001/pythia"
Issues = "https://github.com/bi0shacker001/pythia/issues"
Lutris = "https://github.com/lutris/lutris"

[dependency-groups]
dev = [
    "ruff==0.12.1",
    "mypy==1.16.1",
    "mypy-baseline",
    "nose2",
    "pygobject-stubs>=2.17.0"
]


[tool.setuptools.packages.find]
include = ["pythia", "pythia.*"]

[tool.setuptools.package-data]
# The Qt UIs' pages and QML, loaded from beside their modules.
"pythia.ui.desktop" = ["web/*"]
"pythia.ui.bigpicture" = ["qml/*"]

[[tool.setuptools-rust.ext-modules]]
# Pythia's droidtop side (native/), one build for every Python from 3.10 on.
target = "pythia._native"
path = "native/Cargo.toml"
binding = "PyO3"
py-limited-api = "cp310"

[tool.setuptools.data-files]
# pythia.util.datapath and the game-launch wrapper are looked up under the prefix.
"share/pythia/bin" = ["share/pythia/bin/pythia-wrapper"]
"share/pythia/conf" = ["share/pythia/conf/*"]
"share/pythia/json" = ["share/pythia/json/*"]
"share/pythia/media" = ["share/pythia/media/*"]
"share/pythia/ui" = ["share/pythia/ui/*"]

[tool.mypy]
python_version = "3.10"
packages = [
    "pythia",
    "tests",
]
exclude = [
    ".*_pb2.py",  # Any automatically generated protobuf files
    "venv",
    "^build/",  # setuptools build output
]
disable_error_code = [
    "no-redef",  # Allow variable redefinition
    "has-type",  # Ignore when variable types cannot be determined.
    "dict-item",  # Dictionaries are always fully dynamic
    "var-annotated",  # Never require type annotations
    "assignment",  # Allow incompatible types in assignment (used heavily in pythia class structure).
]
allow_redefinition = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.mypy-baseline]
# --baseline-path: the file where the baseline should be stored
baseline_path = ".mypy_baseline"
# --depth: cut path names longer than that many directories deep
depth = 40
# --allow-unsynced: do not fail for unsynced resolved errors
allow_unsynced = true
# --preserve-position: do not remove error position from the baseline
preserve_position = false
# --hide-stats: do not show stats and messages at the end
hide_stats = false
# --no-colors: do not use colors in stats
no_colors = false
# --ignore: regexes for error messages to ignore
ignore = []

[[tool.mypy.overrides]]
module = [
    "pythia.api",
    "pythia.cache",
    "pythia.config",
    "pythia.database.*",
    "pythia.exception_backstops",
    "pythia.exceptions",
    "pythia.monitored_command",
    "pythia.runners",
    "pythia.scanners.default_installers",
    "pythia.services.mame",
    "pythia.settings",
    "pythia.sysoptions",
    "pythia.util",
    "pythia.util.busy",
    "pythia.util.datapath",
    "pythia.util.discord.base",
    "pythia.util.graphics.*",
    "pythia.util.http",
    "pythia.util.jobs",
    "pythia.util.log",
    "pythia.util.flatpak",
    "pythia.util.retroarch.core_config",
    "pythia.util.settings",
    "pythia.util.standalone_scripts",
    "pythia.util.steam.*",
    "pythia.util.shell",
    "pythia.util.system",
    "pythia.util.timer",
    "pythia.util.ubisoft.consts",
    "pythia.util.urlhandler",
    "pythia.util.wine.d3d_extras",
    "pythia.util.wine.dgvoodoo2",
    "pythia.util.xdgshortcuts",
    "pythia.util.yaml",
    "utils.bios_format",
    "utils.meson_post_install",
]
# Equivalent to strict = true for per-module config
# Use strict = true when https://github.com/python/mypy/issues/11401 is fixed
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]

typeCheckingMode = "basic"
reportMissingImports = false
