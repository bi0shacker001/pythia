<!doctype html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pythia</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">P</span><span>Pythia</span></div>
    <div class="search" style="margin:0;flex:1;max-width:560px"><span class="glyph" aria-hidden="true">⌕</span><input class="input" id="top-search" type="search" placeholder="Search the library" aria-label="Search the library (Ctrl+K)"></div>
    <span class="spacer"></span>
    <button class="btn quiet icon" id="bell" type="button" aria-label="Recent">🔔<span id="bell-count" class="visually-hidden"></span></button>
    <button class="btn quiet icon" id="settings-button" type="button" aria-label="Settings">⚙</button>
  </header>
  <nav class="sidebar" aria-label="Pages">
    <div id="nav"></div>
    <div class="sidebar-foot" id="sidebar-foot" aria-live="polite"></div>
  </nav>
  <main class="main" id="main" tabindex="-1" aria-live="off"></main>
</div>
<div class="flashes" id="flashes" aria-live="polite"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="components.js"></script>
<script src="app.js"></script>
</body>
</html>
